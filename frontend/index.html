<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Transit Optimizer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Ensure map loads correctly */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* Fix for Leaflet map sizing */
        .leaflet-container {
            background: #ddd;
            outline: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>🗾 Tokyo Route Finder</h1>
    </header>
    <div id="app-container">
        <aside id="sidebar">
            <h1>Tokyo Navigator</h1>
            <div class="search-group">
                <label>Start Station:</label>
                <input type="text" id="start-search" placeholder="Search or click to select...">
                <div id="suggestions-dropdown" class="suggestions-dropdown"></div>
                <input type="hidden" id="start-station-id">
            </div>
            <div class="search-group">
                <label>End Station:</label>
                <input type="text" id="end-search" placeholder="Search or click to select...">
                <div id="end-suggestions-dropdown" class="suggestions-dropdown"></div>
                <input type="hidden" id="end-station-id">
            </div>
            <div class="options">
                <label><input type="radio" name="priority" value="shortest_time" checked> Quãng đường ngắn nhất</label>
                <label><input type="radio" name="priority" value="lowest_cost"> Rẻ nhất</label>
                <label><input type="radio" name="priority" value="least_transfers"> Ít phải đổi tuyến nhất</label>
            </div>
            <button id="find-path-btn">Find Route</button>
            <button id="reload-map-btn" style="background: #ff9800; margin-bottom: 15px;">🔄 Reload Map</button>
            <div id="result-info"></div>
        </aside>

        <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Pre-initialization setup
        window.addEventListener('DOMContentLoaded', () => {
            console.log('=== Pre-Init ===');
            console.log('Leaflet:', typeof L !== 'undefined' ? 'LOADED ✓' : 'NOT LOADED ✗');
            console.log('Map container:', document.getElementById('map') ? 'FOUND ✓' : 'NOT FOUND ✗');
            
            // Force map container sizing
            const mapContainer = document.getElementById('map');
            if (mapContainer) {
                mapContainer.style.width = '100%';
                mapContainer.style.height = '100%';
                console.log('Map container size set to 100%');
            }
        });
        
        window.addEventListener('load', () => {
            console.log('Page fully loaded');
            console.log('Leaflet version:', L ? L.version : 'NOT LOADED');
            
            // Force layout recalculation
            setTimeout(() => {
                if (window.mapViewInstance) {
                    console.log('Forcing map invalidateSize...');
                    window.mapViewInstance.map.invalidateSize(true);
                }
            }, 500);
        });
    </script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/components/map-view.js"></script>
</body>
</html>
